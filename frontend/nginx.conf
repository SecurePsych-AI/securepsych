server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA — send all non-asset requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long timeout for AI operations (Ollama can be slow on first inference)
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
}
